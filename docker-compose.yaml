services:
  gateway:
    build:
      context: ./src/
      dockerfile: gateway/Dockerfile
    container_name: gateway
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - GATEWAYHOST=gateway
      - GATEWAYPORT=8000
      - MOMHOST=rabbitmq
      - COLADATOS=EntradaDatos
      - COLARESPUESTAS=Respuestas
      - LOTE=1
      - PYTHONUNBUFFERED=1

  rabbitmq:
      build:
        context: ./src/middleware
        dockerfile: Dockerfile
      container_name: rabbitmq
      environment:
      - RABBITMQ_LOG_LEVELS=error
      healthcheck:
        interval: 5s
        retries: 10
        start_period: 50s
        test: rabbitmq-diagnostics check_port_connectivity
        timeout: 3s
      ports:
      - 5672:5672
      - 15672:15672

  cliente_0:
    build:
      context: ./src/
      dockerfile: cliente/Dockerfile
    container_name: cliente_0
    depends_on:
    - gateway
    environment:
    - DATASETPATHEN=/datasets/enwiki_namespace_0_
    - DATASETPATHFR=/datasets/frwiki_namespace_0_
    - TOTALDATASETS=1
    - GATEWAYHOST=gateway
    - GATEWAYPORT=8000
    - LOTE=1
    - PYTHONUNBUFFERED=1
    volumes:
    - ./datasets:/datasets

  clasificador_0:
    build:
      context: ./src/
      dockerfile: clasificador/Dockerfile
    container_name: clasificador_0
    depends_on:
        rabbitmq:
          condition: service_healthy
        gateway:
          condition: service_started
    environment:
      - PYTHONUNBUFFERED=1
      - MOMHOST=rabbitmq
      - COLADATOS=EntradaDatos
      - COLARESPUESTAS=Respuestas
      - COLAIMGDOWLOADER=ImgDowloader
      - COLATRANSFORMADOR=ColaTransformador

  transformador_0:
    build:
      context: ./src/
      dockerfile: transformador/Dockerfile
    container_name: transformador_0
    depends_on:
        rabbitmq:
          condition: service_healthy
        gateway:
          condition: service_started
        clasificador_0:
          condition: service_started
    environment:
      - PYTHONUNBUFFERED=1
      - MOMHOST=rabbitmq
      - COLATRANSFORMADOR=ColaTransformador
      - COLASUMTOP=ColaSumTop
      - COLASUMPROM=ColaSumProm
      - EXCHANGECUENTAPROM=ExchangeCuentaProm
      - TOTALCUENTAPROM=1

  cuenta_prom_0:
    build:
      context: ./src/
      dockerfile: cuentaProm/Dockerfile
    container_name: cuenta_prom_0
    depends_on:
        rabbitmq:
          condition: service_healthy
        gateway:
          condition: service_started
        clasificador_0:
          condition: service_started
        transformador_0:
          condition: service_started
    environment:
      - PYTHONUNBUFFERED=1
      - MOMHOST=rabbitmq
      - EXCHANGECUENTAPROM=ExchangeCuentaProm
      - COLARESPUESTAS=Respuestas
      - ID=0
