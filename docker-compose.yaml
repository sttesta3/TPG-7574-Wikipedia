services:
  nodo-base:
    command: ["true"]
    build:
      context: ./src/
      dockerfile: base/Dockerfile

  gateway:
    build:
      context: ./src/
      dockerfile: gateway/Dockerfile
    container_name: gateway
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - GATEWAYHOST=gateway
      - GATEWAYPORT=8000
      - MOMHOST=rabbitmq
      - COLADATOS=EntradaDatos
      - COLARESPUESTAS=Respuestas
      - LOTE=10
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 8000), timeout=2); s.close()"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  rabbitmq:
      build:
        context: ./src/middleware
        dockerfile: Dockerfile
      container_name: rabbitmq
      environment:
      - RABBITMQ_LOG_LEVELS=error
      healthcheck:
        interval: 5s
        retries: 1
        start_period: 120s
        test: rabbitmq-diagnostics check_port_connectivity
        timeout: 3s
      ports:
      - 5672:5672
      - 15672:15672

  cliente_0:
    build:
      context: ./src/
      dockerfile: cliente/Dockerfile
    container_name: cliente_0
    depends_on:
      gateway:
        condition: service_healthy
    environment:
    - DATASETPATHEN=/datasets/enwiki_namespace_0_
    - DATASETPATHFR=/datasets/frwiki_namespace_0_
    - TOTALDATASETS=1
    - GATEWAYHOST=gateway
    - GATEWAYPORT=8000
    - LOTE=10
    - PYTHONUNBUFFERED=1
    volumes:
    - ./datasets:/datasets

  clasificador_0:
    build:
      context: ./src/
      dockerfile: clasificador/Dockerfile
      additional_contexts:
        nodo-base: service:nodo-base
    container_name: clasificador_0
    depends_on:
        rabbitmq:
          condition: service_healthy
        gateway:
          condition: service_started
    environment:
      - PYTHONUNBUFFERED=1
      - MOMHOST=rabbitmq
      - COLADATOS=EntradaDatos
      - COLARESPUESTAS=Respuestas
      - COLAIMGDESCARGA=ImgDescarga
      - COLATRANSFORMADOR=ColaTransformador

