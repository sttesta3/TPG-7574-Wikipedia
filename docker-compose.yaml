services:
  nodo-base:
      build:
        context: ./src/
        dockerfile: base/Dockerfile
      image: nodo-base:latest

  gateway:
    build:
      context: ./src/
      dockerfile: gateway/Dockerfile
    container_name: gateway
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - GATEWAYHOST=gateway
      - GATEWAYPORT=8000
      - MOMHOST=rabbitmq
      - COLADATOS=EntradaDatos
      - COLARESPUESTAS=Respuestas
      - LOTE=200
      - TOTALIMGEOF=4
      - TOTALPROMEOF=4
      - TOTALTOPEOF=1
    healthcheck:
      test: ['CMD', 'python3', '-c', "import socket; s=socket.create_connection(('127.0.0.1', 8000), timeout=2); s.close()"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  rabbitmq:
      build:
        context: ./src/middleware
        dockerfile: Dockerfile
      container_name: rabbitmq
      environment:
      - RABBITMQ_LOG_LEVELS=error
      healthcheck:
        interval: 5s
        retries: 3
        start_period: 120s
        test: rabbitmq-diagnostics check_port_connectivity
        timeout: 3s
      ports:
      - 5672:5672
      - 15672:15672

  cliente_0:
    build:
      context: ./src/
      dockerfile: cliente/Dockerfile
    container_name: cliente_0
    depends_on:
      gateway:
        condition: service_healthy
    environment:
    - DATASETPATHEN=/datasets/enwiki_namespace_0_
    - DATASETPATHFR=/datasets/frwiki_namespace_0_
    - TOTALDATASETSEN=5
    - TOTALDATASETSFR=5
    - GATEWAYHOST=gateway
    - GATEWAYPORT=8000
    - LOTE=400
    - ID=0
    - PYTHONUNBUFFERED=1
    volumes:
    - ./datasets:/datasets
    - ./output:/output


