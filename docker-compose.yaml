services:
  nodo-base:
      build:
        context: ./src/
        dockerfile: base/Dockerfile
      image: nodo-base:latest

  gateway:
    build:
      context: ./src/
      dockerfile: gateway/Dockerfile
    container_name: gateway
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - GATEWAYHOST=gateway
      - GATEWAYPORT=8000
      - MOMHOST=rabbitmq
      - COLADATOS=EntradaDatos
      - COLARESPUESTAS=Respuestas
      - LOTE=10
      - TOTALIMGEOF=1
      - TOTALPROMEOF=1
      - TOTALTOPEOF=1
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 8000), timeout=2); s.close()"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 5s

  rabbitmq:
      build:
        context: ./src/middleware
        dockerfile: Dockerfile
      container_name: rabbitmq
      environment:
      - RABBITMQ_LOG_LEVELS=error
      healthcheck:
        interval: 5s
        retries: 1
        start_period: 120s
        test: rabbitmq-diagnostics check_port_connectivity
        timeout: 3s
      ports:
      - 5672:5672
      - 15672:15672

  cliente_0:
    build:
      context: ./src/
      dockerfile: cliente/Dockerfile
    container_name: cliente_0
    depends_on:
      gateway:
        condition: service_healthy
    environment:
    - DATASETPATHEN=/datasets/enwiki_namespace_0_
    - DATASETPATHFR=/datasets/frwiki_namespace_0_
    - TOTALDATASETS=1
    - GATEWAYHOST=gateway
    - GATEWAYPORT=8000
    - LOTE=10
    - PYTHONUNBUFFERED=1
    volumes:
    - ./datasets:/datasets
    - ./output:/output

  clasificador_0:
    build:
      context: ./src/
      dockerfile: clasificador/Dockerfile
    container_name: clasificador_0
    depends_on:
        rabbitmq:
          condition: service_healthy
        gateway:
          condition: service_started
        nodo-base:
          condition: service_started
    environment:
      - PYTHONUNBUFFERED=1
      - MOMHOST=rabbitmq
      - COLADATOS=EntradaDatos
      - COLARESPUESTAS=Respuestas
      - COLAIMGDESCARGA=ImgDescarga
      - COLATRANSFORMADOR=ColaTransformador
      - CLASIFICADOREXCHANGEEOF=ClasificadorExchangeEof

  img_descargador_0:
    build:
      context: ./src/
      dockerfile: imgDescargador/Dockerfile
    container_name: imgDescargador_0
    depends_on:
        rabbitmq:
          condition: service_healthy
        gateway:
          condition: service_started
        clasificador_0:
          condition: service_started
        nodo-base:
          condition: service_started
    environment:
      - PYTHONUNBUFFERED=1
      - MOMHOST=rabbitmq
      - COLARESPUESTAS=Respuestas
      - COLAIMGDESCARGA=ImgDescarga
      - EXCHANGEIMGEOF=ExchangeImgEof
      - TOTALCLASIFICADORES=1
      - MAXCLIENTES=10

  transformador_0:
    build:
      context: ./src/
      dockerfile: transformador/Dockerfile
    container_name: transformador_0
    depends_on:
        rabbitmq:
          condition: service_healthy
        gateway:
          condition: service_started
        clasificador_0:
          condition: service_started
        nodo-base:
          condition: service_started
    environment:
      - PYTHONUNBUFFERED=1
      - MOMHOST=rabbitmq
      - COLATRANSFORMADOR=ColaTransformador
      - COLASUMTOP=ColaSumTop
      - EXCHANGEPROMEDIO=ExchangePromedio
      - EXCHANGECUENTAPROM=ExchangeCuentaProm
      - EXCHANGETRANSFORMADOREOF=ExchangeTransformadorEof
      - TOTALCUENTAPROM=1
      - TOTALPROMEDIO=1
      - TOTALCLASIFICADORES=1

  cuenta_prom_0:
    build:
      context: ./src/
      dockerfile: cuentaProm/Dockerfile
    container_name: cuentaProm_0
    depends_on:
        rabbitmq:
          condition: service_healthy
        gateway:
          condition: service_started
        clasificador_0:
          condition: service_started
        transformador_0:
          condition: service_started
        nodo-base:
          condition: service_started
    environment:
      - PYTHONUNBUFFERED=1
      - MOMHOST=rabbitmq
      - EXCHANGECUENTAPROM=ExchangeCuentaProm
      - COLARESPUESTAS=Respuestas
      - ID=0

  promedio_0:
    build:
      context: ./src/
      dockerfile: promedio/Dockerfile
    container_name: promedio_0
    depends_on:
        rabbitmq:
          condition: service_healthy
        gateway:
          condition: service_started
        clasificador_0:
          condition: service_started
        transformador_0:
          condition: service_started
        nodo-base:
          condition: service_started
    environment:
      - PYTHONUNBUFFERED=1
      - MOMHOST=rabbitmq
      - EXCHANGECUENTAPROM=ExchangeCuentaProm
      - EXCHANGEPROMEDIO=ExchangePromedio
      - TOTALCUENTAPROM=1
      - TOTALTRANSFORMADORES=1
      - ID=0

  sum_top_0:
    build:
      context: ./src/
      dockerfile: sumTop/Dockerfile
    container_name: sum_top_0
    depends_on:
        rabbitmq:
          condition: service_healthy
        gateway:
          condition: service_started
        clasificador_0:
          condition: service_started
        nodo-base:
          condition: service_started
    environment:
      - PYTHONUNBUFFERED=1
      - MOMHOST=rabbitmq
      - COLASUMTOP=ColaSumTop
      - EXCHANGESUMTOPEOF=ExchangeSumTopEof
      - EXCHANGETOPPARCIAL=ExchangeTopParcial
      - TOTALTOPPARCIAL=1
      - TOTALTRANSFORMADORES=1

  agregador_top_0:
    build:
      context: ./src/
      dockerfile: agregadorTop/Dockerfile
    container_name: agregador_top_0
    depends_on:
        rabbitmq:
          condition: service_healthy
        gateway:
          condition: service_started
        clasificador_0:
          condition: service_started
        nodo-base:
          condition: service_started
    environment:
      - PYTHONUNBUFFERED=1
      - MOMHOST=rabbitmq
      - COLASUMTOP=ColaSumTop
      - COLARESPUESTAS=Respuestas
      - EXCHANGESUMTOPEOF=ExchangeSumTopEof
      - EXCHANGETOPPARCIAL=ExchangeTopParcial
      - EXCHANGETOPGLOBAL=ExchangeTopGlobal
      - TOTALTOPGLOBAL=1
      - TOTALSUMTOP=1
      - ID=0

  join_top_0:
    build:
      context: ./src/
      dockerfile: joinTop/Dockerfile
    container_name: join_top_0
    depends_on:
        rabbitmq:
          condition: service_healthy
        gateway:
          condition: service_started
        clasificador_0:
          condition: service_started
        nodo-base:
          condition: service_started
    environment:
      - PYTHONUNBUFFERED=1
      - MOMHOST=rabbitmq
      - COLARESPUESTAS=Respuestas
      - EXCHANGETOPGLOBAL=ExchangeTopGlobal
      - TOTALTOPPARCIAL=1
      - ID=0

