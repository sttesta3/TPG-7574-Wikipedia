services:
  cliente_1:
    build:
      context: ./src/
      dockerfile: cliente/Dockerfile
    container_name: cliente_1
    depends_on:
    - gateway
    environment:
    - FILE=/datasets/enwiki_namespace_0_00000.parquet
    - GATEWAYHOST=gateway
    - GATEWAYPORT=8000
    - LOTE=1
    - PYTHONUNBUFFERED=1
    volumes:
    - ./datasets:/datasets

  gateway:
    build:
      context: ./src/
      dockerfile: gateway/Dockerfile
    container_name: gateway
    environment:
      - GATEWAYHOST=gateway
      - GATEWAYPORT=8000
      - LOTE=1
      - PYTHONUNBUFFERED=1