services:
  gateway:
    build:
      context: ./src/
      dockerfile: gateway/Dockerfile
    container_name: gateway
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - GATEWAYHOST=gateway
      - GATEWAYPORT=8000
      - MOMHOST=rabbitmq
      - COLADATOS=EntradaDatos
      - COLARESPUESTAS=Respuestas
      - LOTE=10
      - PYTHONUNBUFFERED=1

  rabbitmq:
      build:
        context: ./src/middleware
        dockerfile: Dockerfile
      container_name: rabbitmq
      environment:
      - RABBITMQ_LOG_LEVELS=error
      healthcheck:
        interval: 5s
        retries: 1
        start_period: 50s
        test: rabbitmq-diagnostics check_port_connectivity
        timeout: 3s
      ports:
      - 5672:5672
      - 15672:15672

  cliente_0:
    build:
      context: ./src/
      dockerfile: cliente/Dockerfile
    container_name: cliente_0
    depends_on:
      gateway:
        condition: service_started
    environment:
    - DATASETPATHEN=/datasets/enwiki_namespace_0_
    - DATASETPATHFR=/datasets/frwiki_namespace_0_
    - TOTALDATASETS=5
    - GATEWAYHOST=gateway
    - GATEWAYPORT=8000
    - LOTE=10
    - PYTHONUNBUFFERED=1
    volumes:
    - ./datasets:/datasets

  clasificador_0:
    build:
      context: ./src/
      dockerfile: clasificador/Dockerfile
    container_name: clasificador_0
    depends_on:
        rabbitmq:
          condition: service_healthy
        gateway:
          condition: service_started
    environment:
      - PYTHONUNBUFFERED=1
      - MOMHOST=rabbitmq
      - COLADATOS=EntradaDatos
      - COLARESPUESTAS=Respuestas
      - COLAIMGDESCARGA=ImgDescarga
      - COLATRANSFORMADOR=ColaTransformador

  img_descargador_0:
    build:
      context: ./src/
      dockerfile: imgDescargador/Dockerfile
    container_name: imgDescargador_0
    depends_on:
        rabbitmq:
          condition: service_healthy
        gateway:
          condition: service_started
        clasificador_0:
          condition: service_started
    environment:
      - PYTHONUNBUFFERED=1
      - MOMHOST=rabbitmq
      - COLARESPUESTAS=Respuestas
      - COLAIMGDESCARGA=ImgDescarga
      - EXCHANGEIMGEOF=ExchangeImgEof

  img_descargador_1:
    build:
      context: ./src/
      dockerfile: imgDescargador/Dockerfile
    container_name: imgDescargador_1
    depends_on:
        rabbitmq:
          condition: service_healthy
        gateway:
          condition: service_started
        clasificador_0:
          condition: service_started
    environment:
      - PYTHONUNBUFFERED=1
      - MOMHOST=rabbitmq
      - COLARESPUESTAS=Respuestas
      - COLAIMGDESCARGA=ImgDescarga
      - EXCHANGEIMGEOF=ExchangeImgEof

  transformador_0:
    build:
      context: ./src/
      dockerfile: transformador/Dockerfile
    container_name: transformador_0
    depends_on:
        rabbitmq:
          condition: service_healthy
        gateway:
          condition: service_started
        clasificador_0:
          condition: service_started
    environment:
      - PYTHONUNBUFFERED=1
      - MOMHOST=rabbitmq
      - COLATRANSFORMADOR=ColaTransformador
      - COLASUMTOP=ColaSumTop
      - EXCHANGEPROMEDIO=ExchangePromedio
      - EXCHANGECUENTAPROM=ExchangeCuentaProm
      - TOTALCUENTAPROM=1
      - TOTALPROMEDIO=1

  cuenta_prom_0:
    build:
      context: ./src/
      dockerfile: cuentaProm/Dockerfile
    container_name: cuentaProm_0
    depends_on:
        rabbitmq:
          condition: service_healthy
        gateway:
          condition: service_started
        clasificador_0:
          condition: service_started
        transformador_0:
          condition: service_started
    environment:
      - PYTHONUNBUFFERED=1
      - MOMHOST=rabbitmq
      - EXCHANGECUENTAPROM=ExchangeCuentaProm
      - COLARESPUESTAS=Respuestas
      - ID=0

  promedio_0:
    build:
      context: ./src/
      dockerfile: promedio/Dockerfile
    container_name: promedio_0
    depends_on:
        rabbitmq:
          condition: service_healthy
        gateway:
          condition: service_started
        clasificador_0:
          condition: service_started
        transformador_0:
          condition: service_started
    environment:
      - PYTHONUNBUFFERED=1
      - MOMHOST=rabbitmq
      - EXCHANGECUENTAPROM=ExchangeCuentaProm
      - EXCHANGEPROMEDIO=ExchangePromedio
      - TOTALCUENTAPROM=1
      - ID=0
