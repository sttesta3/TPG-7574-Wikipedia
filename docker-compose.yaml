services:
  gateway:
    build:
      context: ./src/
      dockerfile: gateway/Dockerfile
    container_name: gateway
    depends_on:
    - rabbitmq
    environment:
      - GATEWAYHOST=gateway
      - GATEWAYPORT=8000
      - MOMHOST=rabbitmq
      - COLADATOS=EntradaDatos
      - COLARESPUESTAS=Respuestas
      - LOTE=1
      - PYTHONUNBUFFERED=1

  rabbitmq:
      build:
        context: ./src/middleware
        dockerfile: Dockerfile
      container_name: rabbitmq
      environment:
      - RABBITMQ_LOG_LEVELS=error
      healthcheck:
        interval: 5s
        retries: 10
        start_period: 50s
        test: rabbitmq-diagnostics check_port_connectivity
        timeout: 3s
      ports:
      - 5672:5672
      - 15672:15672

  cliente_1:
    build:
      context: ./src/
      dockerfile: cliente/Dockerfile
    container_name: cliente_1
    depends_on:
    - gateway
    environment:
    - DATASETPATHEN=/datasets/enwiki_namespace_0_
    - DATASETPATHFR=/datasets/frwiki_namespace_0_
    - TOTALDATASETS=1
    - GATEWAYHOST=gateway
    - GATEWAYPORT=8000
    - LOTE=1
    - PYTHONUNBUFFERED=1
    volumes:
    - ./datasets:/datasets

  clasificador_1:
    build:
      context: ./src/
      dockerfile: clasificador/Dockerfile
    container_name: clasificador_1
    depends_on:
      - gateway
      - rabbitmq
    environment:
      - PYTHONBUFFFERED=1
      - MOMHOST=rabbitmq
      - COLADATOS=EntradaDatos
      - COLARESPUESTAS=Respuestas
  